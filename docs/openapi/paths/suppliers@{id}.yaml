parameters:
  - $ref: '../components/parameters/IdParam.yaml'

get:
  summary: Get a supplier by id
  description: |
    Returns the complete data of a supplier by its identifier.

    Responds 404 for a supplier that was dado de baja: the row is kept, but
    from the outside that supplier no longer exists, so it is never returned
    with active:false.
  operationId: getSupplierById
  tags:
    - Suppliers
  responses:
    '200':
      description: Requested supplier.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Supplier.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'

patch:
  summary: Update a supplier
  description: |
    Partial update. Only the fields sent are modified.
    The supplierType is set on creation and cannot be modified.
    The optional fields (cuit, contactName, contactEmail, contactPhone,
    address, observation) can be cleared by sending null.

    Responds 409 when the new cuit or legalName already belong to another
    **active** supplier; the legalName is compared ignoring case. The supplier
    being updated never clashes with itself, and the cuit and legal name of a
    supplier dado de baja are free to be taken.

    Responds 404 when the supplier is inactive. There is no reactivation: the
    `active` field is not accepted in the body and is rejected as an unknown
    property with a 400.
  operationId: updateSupplier
  tags:
    - Suppliers
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/SupplierUpdate.yaml'
  responses:
    '200':
      description: Updated supplier.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Supplier.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
    '409':
      $ref: '../components/responses/Conflict.yaml'

delete:
  summary: Deactivate a supplier
  description: |
    Registra la baja. Logical deletion: the row is kept and its active flag is
    set to false, so materials and other records that reference the supplier
    remain valid.

    There is no reactivation. Once dado de baja the supplier is invisible to
    every query and releases its cuit and legal name, so bringing it back
    could duplicate whoever took them. To work with that supplier again it is
    registered anew.

    Responds 404 when the supplier does not exist **or is already inactive**:
    in both cases there is nothing to give de baja.

    PENDIENTE: this operation should also answer 409 when the supplier is
    still assigned to work orders that are not in a final state. That rule is
    not implemented, because there is no work-order model in the database yet
    (only the WORK_ORDER value of the entity_type_enum, used by `file` for its
    polymorphic FK). It has to be added together with the work-orders module.
  operationId: deactivateSupplier
  tags:
    - Suppliers
  responses:
    '204':
      description: Supplier deactivated successfully. No content.
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
