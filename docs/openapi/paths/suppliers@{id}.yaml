parameters:
  - $ref: '../components/parameters/IdParam.yaml'

get:
  summary: Get a supplier by id
  description: Returns the complete data of a supplier by its identifier.
  operationId: getSupplierById
  tags:
    - Suppliers
  responses:
    '200':
      description: Requested supplier.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Supplier.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'

patch:
  summary: Update a supplier
  description: |
    Partial update. Only the fields sent are modified.
    The supplierTypes are set on creation and cannot be modified.
    The optional fields (cuit, contactName, contactEmail, contactPhone,
    address) can be cleared by sending null.

    Responds 409 when the new cuit or legalName already belong to another
    supplier, active or inactive.
  operationId: updateSupplier
  tags:
    - Suppliers
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/SupplierUpdate.yaml'
  responses:
    '200':
      description: Updated supplier.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Supplier.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
    '409':
      $ref: '../components/responses/Conflict.yaml'

delete:
  summary: Deactivate a supplier
  description: |
    Logical deletion. The record is kept and its active flag is set to
    false, so materials and other records that reference the supplier
    remain valid. Reactivation is done with PATCH { "active": true }.

    Responds 409 when the supplier is still assigned to work orders that
    are not in a final state.
  operationId: deactivateSupplier
  tags:
    - Suppliers
  responses:
    '204':
      description: Supplier deactivated successfully.
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
    '409':
      $ref: '../components/responses/Conflict.yaml'
