parameters:
  - $ref: '../components/parameters/IdParam.yaml'

get:
  summary: Consultar proveedor
  description: |
    **Roles:** `AT` o `EC`.

    Obtiene un proveedor. Un proveedor dado de baja responde `404`: la fila se
    conserva, pero desde afuera ese proveedor ya no existe, así que nunca se
    devuelve con `active: false`.
  operationId: getSupplierById
  tags:
    - Proveedores
  x-roles:
    - AT
    - EC
  responses:
    '200':
      description: Proveedor pedido.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Supplier.yaml'
    '400':
      $ref: '../components/responses/InvalidId.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '404':
      $ref: '../components/responses/SupplierNotFound.yaml'

patch:
  summary: Modificar proveedor
  description: |
    **Roles:** `AT` o `EC`.

    Modificación parcial: se cambian solo los campos que llegan. `supplierType`
    se define en el alta y no se puede modificar. Los campos opcionales se
    borran con `null`.

    Responde `409` cuando el CUIT o la razón social nuevos ya son de otro
    proveedor **activo**. El proveedor modificado nunca choca consigo mismo.

    Responde `404` si el proveedor está dado de baja. No hay reactivación:
    `active` no se acepta y responde `400` como campo desconocido.
  operationId: updateSupplier
  tags:
    - Proveedores
  x-roles:
    - AT
    - EC
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/SupplierUpdate.yaml'
  responses:
    '200':
      description: Proveedor modificado.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Supplier.yaml'
    '400':
      $ref: '../components/responses/SupplierBadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '404':
      $ref: '../components/responses/SupplierNotFound.yaml'
    '409':
      $ref: '../components/responses/SupplierConflict.yaml'

delete:
  summary: Dar de baja un proveedor
  description: |
    **Roles:** `AT` o `EC`.

    Baja lógica: la fila se conserva con `active` en `false`, para que los
    materiales y otros registros que referencian al proveedor sigan siendo
    válidos.

    No hay reactivación. Dado de baja, el proveedor es invisible para toda
    consulta y libera su CUIT y su razón social; para volver a operar con él se
    lo registra de nuevo.

    Responde `404` si el proveedor no existe **o ya estaba dado de baja**: en
    los dos casos no hay nada que dar de baja.

    PENDIENTE: también debería responder `409` si el proveedor sigue asignado a
    órdenes de trabajo que no están en un estado final. No está implementado
    porque todavía no existe el modelo de órdenes de trabajo; se agrega con ese
    módulo.
  operationId: deactivateSupplier
  tags:
    - Proveedores
  x-roles:
    - AT
    - EC
  responses:
    '204':
      description: Proveedor dado de baja. Sin cuerpo.
    '400':
      $ref: '../components/responses/InvalidId.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '404':
      $ref: '../components/responses/SupplierNotFound.yaml'
