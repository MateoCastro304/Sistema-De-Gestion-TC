get:
  summary: Consultar proveedores
  description: |
    **Roles:** `AT` o `EC`.

    Página de proveedores con el total que cumple los filtros. Devuelve solo
    los activos: la baja es lógica, pero un proveedor dado de baja deja de
    existir para toda consulta, así que no hay parámetro para incluirlos.
  operationId: listSuppliers
  tags:
    - Proveedores
  x-roles:
    - AT
    - EC
  parameters:
    - $ref: '../components/parameters/PageParam.yaml'
    - $ref: '../components/parameters/LimitParam.yaml'
    - name: type
      in: query
      required: false
      description: |
        Solo los proveedores de ese rubro. Excluyente: un proveedor tiene un
        solo rubro, así que `?type=MATERIAL` devuelve solo los de materiales.
      schema:
        $ref: '../components/schemas/Supplier.yaml#/properties/supplierType'
    - name: search
      in: query
      required: false
      description: |
        Búsqueda libre: coincide con la razón social o la persona de contacto
        (contiene el texto, sin distinguir mayúsculas) o con el CUIT (contiene
        el texto).

        En el CUIT se ignoran los separadores de los dos lados: se guarda como
        11 dígitos, así que `30-712` encuentra al proveedor con CUIT
        30-71234567-1. Una búsqueda sin dígitos nunca coincide con un CUIT.

        Un valor en blanco se ignora en vez de no coincidir con nada.
      schema:
        type: string
        maxLength: 120
      example: aceros
  responses:
    '200':
      description: Página de proveedores con el total que cumple los filtros.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/SupplierList.yaml'
    '400':
      $ref: '../components/responses/InvalidQuery.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'

post:
  summary: Registrar proveedor
  description: |
    **Roles:** `AT` o `EC`.

    Registra un proveedor, que queda activo. Solo `legalName` y `supplierType`
    son obligatorios.

    Responde `409` cuando el CUIT o la razón social ya son de otro proveedor
    **activo** (la razón social, sin distinguir mayúsculas). Un proveedor dado
    de baja libera los dos, así que un proveedor nuevo los puede tomar sin
    revivir el registro viejo.
  operationId: createSupplier
  tags:
    - Proveedores
  x-roles:
    - AT
    - EC
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/SupplierCreate.yaml'
  responses:
    '201':
      description: Proveedor registrado.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Supplier.yaml'
    '400':
      $ref: '../components/responses/SupplierBadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '409':
      $ref: '../components/responses/SupplierConflict.yaml'
