get:
  summary: List suppliers
  description: Returns a paginated list of suppliers.
  operationId: listSuppliers
  tags:
    - Suppliers
  parameters:
    - $ref: '../components/parameters/PageParam.yaml'
    - $ref: '../components/parameters/LimitParam.yaml'
  responses:
    '200':
      description: List of suppliers for the requested page.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas/Supplier.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'

post:
  summary: Create a supplier
  description: |
    Registers a new supplier in the system. Only legalName and supplierTypes
    are required, and at least one supplier type must be sent; the id,
    createdAt and updatedAt fields are generated by the server.

    Responds 409 when the cuit or the legalName already belong to another
    supplier, active or inactive.
  operationId: createSupplier
  tags:
    - Suppliers
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/SupplierCreate.yaml'
  responses:
    '201':
      description: Supplier created successfully.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Supplier.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '409':
      $ref: '../components/responses/Conflict.yaml'
