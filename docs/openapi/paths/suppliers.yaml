get:
  summary: List suppliers
  description: Returns a paginated list of suppliers.
  operationId: listSuppliers
  tags:
    - Suppliers
  parameters:
    - $ref: '../components/parameters/PageParam.yaml'
    - $ref: '../components/parameters/LimitParam.yaml'
  responses:
    '200':
      description: List of suppliers for the requested page.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas/Supplier.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'

post:
  summary: Create a supplier
  description: Registers a new supplier in the system.
  operationId: createSupplier
  tags:
    - Suppliers
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/SupplierCreate.yaml'
  responses:
    '201':
      description: Supplier created successfully.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Supplier.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
