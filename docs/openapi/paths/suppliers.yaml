get:
  summary: List suppliers
  description: |
    Returns a paginated page of suppliers together with the total matching the
    filters.

    Only active suppliers are returned. The baja is logical, but a supplier
    dado de baja stops existing for every query, so there is no flag to
    include them.
  operationId: listSuppliers
  tags:
    - Suppliers
  parameters:
    - $ref: '../components/parameters/PageParam.yaml'
    - $ref: '../components/parameters/LimitParam.yaml'
    - name: type
      in: query
      required: false
      description: |
        Narrows the list to the suppliers of this type. Exclusive: a supplier
        carries a single type, so ?type=MATERIAL returns only the material
        ones.
      schema:
        $ref: '../components/schemas/Supplier.yaml#/properties/supplierType'
    - name: search
      in: query
      required: false
      description: |
        Free-text search, matching the legalName or the contactName as a
        case-insensitive substring, or the cuit as a substring.

        For the cuit the separators are ignored on both sides: the value is
        stored as 11 bare digits, so `30-712` finds the supplier whose CUIT is
        30-71234567-1. A search with no digits at all never matches a cuit.

        A blank value is ignored rather than matching nothing.
      schema:
        type: string
        maxLength: 120
      example: aceros
  responses:
    '200':
      description: Page of suppliers with the total matching the filters.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/SupplierList.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'

post:
  summary: Create a supplier
  description: |
    Registers a new supplier in the system. Only legalName and supplierType
    are required; the id, createdAt and updatedAt fields are generated by the
    server and the supplier starts active.

    Responds 409 when the cuit or the legalName already belong to another
    **active** supplier. The legalName is compared ignoring case. A supplier
    that was dado de baja releases both, so its cuit and legal name can be
    taken by a new supplier without reviving the old record.
  operationId: createSupplier
  tags:
    - Suppliers
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/SupplierCreate.yaml'
  responses:
    '201':
      description: Supplier created successfully.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Supplier.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '409':
      $ref: '../components/responses/Conflict.yaml'
