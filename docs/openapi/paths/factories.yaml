get:
  summary: List factories
  description: Returns a paginated list of client factories.
  operationId: listFactories
  tags:
    - Factories
  parameters:
    - $ref: '../components/parameters/PageParam.yaml'
    - $ref: '../components/parameters/LimitParam.yaml'
  responses:
    '200':
      description: List of factories for the requested page.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas/Factory.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'

post:
  summary: Create a factory
  description: |
    Registers a new client factory. The factory is created without
    managers; they are added later via /factories/{factoryId}/managers.
  operationId: createFactory
  tags:
    - Factories
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/FactoryCreate.yaml'
  responses:
    '201':
      description: Factory created successfully.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Factory.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
