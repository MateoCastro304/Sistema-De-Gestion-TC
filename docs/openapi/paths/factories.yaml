get:
  summary: List factories
  description: Returns a paginated list of client factories.
  operationId: listFactories
  tags:
    - Factories
  parameters:
    - $ref: '../components/parameters/PageParam.yaml'
    - $ref: '../components/parameters/LimitParam.yaml'
  responses:
    '200':
      description: Page of factories matching the filters, with the total count.
      content:
        application/json:
          schema:
            type: object
            required: [items, total, page, limit]
            properties:
              items:
                type: array
                items:
                  $ref: '../components/schemas/Factory.yaml'
              total:
                type: integer
                minimum: 0
                description: Total number of factories matching the filters.
              page:
                type: integer
                minimum: 1
              limit:
                type: integer
                minimum: 1
    '401':
      $ref: '../components/responses/Unauthorized.yaml'

post:
  summary: Create a factory
  description: |
    Registers a new client factory. The factory is created without
    managers; they are added later via /factories/{factoryId}/managers.
  operationId: createFactory
  tags:
    - Factories
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/FactoryCreate.yaml'
  responses:
    '201':
      description: Factory created successfully.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Factory.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
