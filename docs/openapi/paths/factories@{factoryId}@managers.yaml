parameters:
  - $ref: '../components/parameters/FactoryIdParam.yaml'

get:
  summary: List managers of a factory
  description: Returns all managers registered under the given factory.
  operationId: listFactoryManagers
  tags:
    - Managers
  parameters:
    - $ref: '../components/parameters/PageParam.yaml'
    - $ref: '../components/parameters/LimitParam.yaml'
  responses:
    '200':
      description: List of managers for the factory.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas/Manager.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'

post:
  summary: Create a manager for a factory
  description: |
    Adds a new manager to the given factory. The factory is identified
    by the path parameter; it does not go in the body.
  operationId: createFactoryManager
  tags:
    - Managers
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/ManagerCreate.yaml'
  responses:
    '201':
      description: Manager created successfully.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Manager.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
