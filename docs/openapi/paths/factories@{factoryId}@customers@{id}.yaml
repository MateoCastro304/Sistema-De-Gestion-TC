parameters:
  - $ref: '../components/parameters/FactoryIdParam.yaml'
  - $ref: '../components/parameters/IdParam.yaml'

get:
  summary: Consultar encargado
  description: |
    **Rol:** `ERP`.

    Obtiene un encargado por su clave (`factoryId`, `id`). Un encargado dado de
    baja también se devuelve, con `isActive` en `false`.
  operationId: getCustomerById
  tags:
    - Encargados
  x-roles:
    - ERP
  responses:
    '200':
      description: Encargado pedido.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Customer.yaml'
    '400':
      $ref: '../components/responses/InvalidId.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '404':
      $ref: '../components/responses/CustomerNotFound.yaml'

patch:
  summary: Modificar encargado
  description: |
    **Rol:** `ERP`.

    Modificación parcial: se cambian solo los campos que llegan, al menos uno.
    La fábrica no se puede cambiar. Tiene que quedar al menos un contacto
    (`phone` o `mail`).
  operationId: updateCustomer
  tags:
    - Encargados
  x-roles:
    - ERP
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/CustomerUpdate.yaml'
        example:
          phone: +54 9 351 555-9876
  responses:
    '200':
      description: Encargado modificado.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Customer.yaml'
    '400':
      description: |
        - `VALIDATION_ERROR`: cuerpo vacío, algún campo inválido o el encargado
          quedaría sin contacto.
        - `INVALID_PATH_PARAMETER`: `factoryId` o `id` no es un entero.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Error.yaml'
          example:
            statusCode: 400
            error: Bad Request
            code: VALIDATION_ERROR
            message: Phone must have between 8 and 15 digits
            path: /api/factories/1/customers/1
            timestamp: '2026-10-15T13:00:00.000Z'
            details:
              - field: phone
                message: Phone must have between 8 and 15 digits
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '404':
      $ref: '../components/responses/CustomerNotFound.yaml'
    '409':
      description: '`CUSTOMER_MAIL_TAKEN`: el mail ya es de otro encargado activo de la fábrica.'
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Error.yaml'
          example:
            statusCode: 409
            error: Conflict
            code: CUSTOMER_MAIL_TAKEN
            message: Customer with mail "compras@oxycam.com" already exists
            path: /api/factories/1/customers/2
            timestamp: '2026-10-15T13:00:00.000Z'
            details:
              - field: mail
                message: Customer with mail "compras@oxycam.com" already exists
