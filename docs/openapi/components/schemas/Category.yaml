type: object
description: Industry category a factory belongs to (for example Metallurgy, Automotive, Agroindustry).
required:
  - id
  - name
  - createdAt
  - updatedAt
properties:
  id:
    type: integer
    format: int64
    description: Unique identifier of the category, autogenerated.
    readOnly: true
    example: 1
  name:
    type: string
    minLength: 1
    maxLength: 80
    description: Short name of the category. Unique across the system.
    example: Metallurgy
  description:
    type: string
    maxLength: 500
    description: Longer description of the category. Optional.
    example: Metallurgical industry (turning, milling, welding).
  createdAt:
    type: string
    format: date-time
    description: Creation timestamp (ISO 8601).
    readOnly: true
    example: '2026-08-22T15:30:00Z'
  updatedAt:
    type: string
    format: date-time
    description: Last modification timestamp (ISO 8601).
    readOnly: true
    example: '2026-08-22T15:30:00Z'
