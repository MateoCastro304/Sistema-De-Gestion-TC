type: object
description: |
  Rubro de una fábrica (Metalúrgica, Autopartes, Petrolera). La baja es lógica
  y reversible: un rubro dado de baja se sigue devolviendo con `active` en
  `false` y se puede restaurar con `POST /categories/{id}/restore`.
required:
  - id
  - name
  - active
  - createdAt
  - updatedAt
properties:
  id:
    type: integer
    format: int64
    description: Identificador único, autogenerado.
    readOnly: true
    example: 1
  name:
    type: string
    minLength: 3
    maxLength: 80
    description: |
      Nombre del rubro. Se guarda sin espacios en los extremos. Único sin
      distinguir mayúsculas, contando también los rubros dados de baja.
    example: Metalúrgica
  active:
    type: boolean
    description: '`false` si fue dado de baja.'
    example: true
  createdAt:
    type: string
    format: date-time
    description: Fecha y hora del alta.
    readOnly: true
    example: '2026-08-22T15:30:00.000Z'
  updatedAt:
    type: string
    format: date-time
    description: Fecha y hora de la última modificación.
    readOnly: true
    example: '2026-08-22T15:30:00.000Z'
