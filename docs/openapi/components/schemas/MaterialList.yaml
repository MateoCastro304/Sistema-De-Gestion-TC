type: object
description: |
  Página de materiales, ordenada por nombre y, dentro de cada nombre, por
  calidad con orden natural de los números ("SAE 62" antes que "SAE 65",
  "1010" antes que "1045"). Sin resultados, `items` vacío y `total` en `0`.
required:
  - items
  - total
  - page
  - limit
properties:
  items:
    type: array
    items:
      $ref: './Material.yaml'
  total:
    type: integer
    format: int64
    minimum: 0
    description: Total de materiales que cumplen los filtros.
    example: 13
  page:
    type: integer
    minimum: 1
    description: Página devuelta.
    example: 1
  limit:
    type: integer
    minimum: 1
    maximum: 100
    description: Tamaño de página aplicado.
    example: 20
