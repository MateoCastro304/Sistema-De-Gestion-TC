type: object
description: |
  Campos modificables de un encargado. Todos opcionales, pero tiene que llegar
  al menos uno. La fábrica no se puede cambiar: forma parte de la clave.
  `lastName`, `phone` y `mail` se borran con `null` o `""`, siempre que quede
  al menos un contacto (`phone` o `mail`).
additionalProperties: false
minProperties: 1
properties:
  firstName:
    type: string
    minLength: 1
    maxLength: 50
    description: Nombre. No vacío.
    example: Marcela
  lastName:
    type: string
    nullable: true
    maxLength: 50
    description: Apellido.
    example: Ríos
  phone:
    type: string
    nullable: true
    maxLength: 50
    description: Teléfono, de 8 a 15 dígitos, con `+` internacional opcional.
    example: +54 9 351 555-1234
  mail:
    type: string
    nullable: true
    format: email
    maxLength: 120
    description: Mail. Único entre los encargados activos de la misma fábrica.
    example: compras@oxycam.com
