description: |
  Error de la baja de un rubro con fábricas activas. Suma `factories`, las
  fábricas a reasignar antes de dar de baja el rubro.
allOf:
  - $ref: './Error.yaml'
  - type: object
    required:
      - factories
    properties:
      factories:
        type: array
        description: Fábricas activas del rubro.
        items:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: integer
              format: int64
              example: 10
            name:
              type: string
              example: OxyCAM S.A.
