type: object
description: |
  Payload required to create a new supplier. Only legalName and supplierTypes
  are mandatory; every other field is optional and may be omitted.
  At least one supplier type must be sent.
  The id, createdAt and updatedAt fields are generated by the server.
required:
  - legalName
  - supplierTypes
properties:
  legalName:
    $ref: './Supplier.yaml#/properties/legalName'
  supplierTypes:
    $ref: './Supplier.yaml#/properties/supplierTypes'
  cuit:
    $ref: './Supplier.yaml#/properties/cuit'
  contactName:
    $ref: './Supplier.yaml#/properties/contactName'
  contactEmail:
    $ref: './Supplier.yaml#/properties/contactEmail'
  contactPhone:
    $ref: './Supplier.yaml#/properties/contactPhone'
  address:
    $ref: './Supplier.yaml#/properties/address'
