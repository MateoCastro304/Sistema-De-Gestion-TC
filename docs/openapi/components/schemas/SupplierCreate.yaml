type: object
description: |
  Payload required to create a new supplier. Only legalName and supplierType
  are mandatory; every other field is optional and may be omitted.
  The id, createdAt and updatedAt fields are generated by the server, and the
  supplier always starts active.
required:
  - legalName
  - supplierType
properties:
  legalName:
    $ref: './Supplier.yaml#/properties/legalName'
  supplierType:
    $ref: './Supplier.yaml#/properties/supplierType'
  cuit:
    $ref: './Supplier.yaml#/properties/cuit'
  contactName:
    $ref: './Supplier.yaml#/properties/contactName'
  contactEmail:
    $ref: './Supplier.yaml#/properties/contactEmail'
  contactPhone:
    $ref: './Supplier.yaml#/properties/contactPhone'
  address:
    $ref: './Supplier.yaml#/properties/address'
  observation:
    $ref: './Supplier.yaml#/properties/observation'
