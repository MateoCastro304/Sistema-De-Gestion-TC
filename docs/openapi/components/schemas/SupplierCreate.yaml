type: object
description: |
  Alta de proveedor. Solo `legalName` y `supplierType` son obligatorios; el
  resto se puede omitir. El proveedor queda activo.
additionalProperties: false
required:
  - legalName
  - supplierType
properties:
  legalName:
    $ref: './Supplier.yaml#/properties/legalName'
  supplierType:
    $ref: './Supplier.yaml#/properties/supplierType'
  cuit:
    $ref: './Supplier.yaml#/properties/cuit'
  contactName:
    $ref: './Supplier.yaml#/properties/contactName'
  contactEmail:
    $ref: './Supplier.yaml#/properties/contactEmail'
  contactPhone:
    type: string
    maxLength: 50
    description: |
      Teléfono de contacto, de 8 a 15 dígitos con `+` internacional opcional.
      Acepta espacios, guiones, puntos y paréntesis, que se descartan al guardar.
    example: +54 9 351 444-5678
  address:
    $ref: './Supplier.yaml#/properties/address'
  observation:
    $ref: './Supplier.yaml#/properties/observation'
