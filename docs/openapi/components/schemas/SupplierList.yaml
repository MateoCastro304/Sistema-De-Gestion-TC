type: object
description: |
  Página de proveedores con el total que cumple los filtros, para que el
  cliente arme el paginador sin pedir todo el catálogo.

  `total` cuenta los proveedores que cumplen los filtros, no los de esta
  página: con `limit=20` sobre 57 coincidencias, `items` trae 20 y `total` es
  57. `page` y `limit` repiten los aplicados porque el servidor completa los
  valores por defecto.
required:
  - items
  - total
  - page
  - limit
properties:
  items:
    type: array
    description: Los proveedores de la página pedida. Solo activos.
    items:
      $ref: './Supplier.yaml'
  total:
    type: integer
    format: int64
    minimum: 0
    description: Total de proveedores activos que cumplen los filtros.
    example: 57
  page:
    type: integer
    minimum: 1
    description: Página devuelta.
    example: 1
  limit:
    type: integer
    minimum: 1
    maximum: 1000
    description: Tamaño de página aplicado.
    example: 20
