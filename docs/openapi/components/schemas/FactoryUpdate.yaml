type: object
description: |
  Campos modificables de una fábrica. Todos opcionales, pero tiene que llegar
  al menos uno. El CUIT no se puede modificar: si llega, responde `400`.
  `address` y `payMethod` se borran con `null` o `""`.
additionalProperties: false
minProperties: 1
properties:
  name:
    type: string
    minLength: 1
    maxLength: 100
    description: Razón social. Única entre las fábricas activas, sin distinguir mayúsculas.
    example: OxyCAM S.A.
  address:
    type: string
    nullable: true
    maxLength: 255
    description: Dirección.
    example: Ruta 9 Km 12, Córdoba
  payMethod:
    type: string
    nullable: true
    maxLength: 255
    description: Aclaraciones sobre el pago (texto libre).
    example: Transferencia a 30 días
  categoryId:
    type: integer
    format: int64
    minimum: 1
    description: Rubro de la fábrica. Tiene que existir y estar activo; si no, responde `400`.
    example: 2
