type: object
description: |
  Modifiable fields of a factory. All optional.
  The taxId cannot be modified.
minProperties: 1
properties:
  legalName:
    type: string
    minLength: 1
    maxLength: 120
    example: OxyCAM S.A.
  categoryId:
    type: integer
    format: int64
    minimum: 1
    description: ID of the category this factory belongs to (references /categories/{id}).
    example: 1
  address:
    type: string
    maxLength: 200
    example: Ruta 9 Km 12, Cordoba
