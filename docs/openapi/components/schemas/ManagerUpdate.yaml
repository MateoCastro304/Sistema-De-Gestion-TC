type: object
description: Modifiable fields of a manager. All optional.
minProperties: 1
properties:
  name:
    type: string
    minLength: 1
    maxLength: 120
    example: Marcela Rios
  email:
    type: string
    format: email
    maxLength: 120
    example: purchasing@oxycam.com
  phone:
    type: string
    maxLength: 40
    example: '+54 9 351 555-1234'
  role:
    type: string
    maxLength: 80
    description: Position or role of the manager within the factory.
    example: Head of Purchasing
