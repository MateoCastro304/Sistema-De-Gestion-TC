type: object
description: Proveedor de materias primas o insumos.
required:
  - id
  - legalName
  - supplierType
  - active
  - createdAt
  - updatedAt
properties:
  id:
    type: integer
    format: int64
    description: Identificador único, autogenerado.
    readOnly: true
    example: 1
  legalName:
    type: string
    minLength: 1
    maxLength: 80
    description: |
      Razón social, tal como está registrada ante el fisco.

      Única entre los proveedores activos, sin distinguir mayúsculas: "Aceros
      del Sur" y "ACEROS DEL SUR" son la misma razón social. Un proveedor dado
      de baja libera su razón social.
    example: Aceros del Sur S.A.
  cuit:
    type: string
    pattern: '^[0-9]{2}-[0-9]{8}-[0-9]{1}$'
    description: |
      CUIT con formato XX-XXXXXXXX-X. Opcional; se omite si no tiene.

      Además del formato se valida que el prefijo sea asignable y el dígito
      verificador correcto: un CUIT bien formado pero inválido responde `400`.

      Único entre los proveedores activos. Un proveedor dado de baja libera su
      CUIT.
    example: 30-71234567-1
  supplierType:
    type: string
    description: |
      Rubro de lo que provee. Un proveedor tiene exactamente uno, que se define
      en el alta y no se puede modificar.

      - `PROCESS` — procesos: mecanizado, soldadura, armado.
      - `REPLACEMENT` — repuestos e insumos.
      - `MATERIAL` — materias primas y semielaborados.
      - `PAINT` — pinturas, recubrimientos y barnices.
    enum:
      - PROCESS
      - REPLACEMENT
      - MATERIAL
      - PAINT
    example: MATERIAL
  contactName:
    type: string
    maxLength: 150
    description: Persona de contacto en el proveedor. Se omite si no tiene.
    example: Diego Fernández
  contactEmail:
    type: string
    format: email
    maxLength: 120
    description: Mail de contacto. Se omite si no tiene.
    example: ventas@acerosdelsur.com
  contactPhone:
    type: string
    maxLength: 50
    description: |
      Teléfono de contacto, de 8 a 15 dígitos con `+` internacional opcional.
      Los separadores (espacios, guiones, puntos, paréntesis) se aceptan al
      cargarlo y se descartan al guardar, así que acá vuelve normalizado. Se
      omite si no tiene.
    example: '+5493514445678'
  address:
    type: string
    maxLength: 255
    description: Dirección. Se omite si no tiene.
    example: Av. Circunvalación 4500, Córdoba
  observation:
    type: string
    maxLength: 255
    description: Nota libre sobre el proveedor. Se omite si no tiene.
    example: Entrega los martes
  active:
    type: boolean
    description: |
      Siempre `true` en una respuesta. La baja es lógica (la fila se conserva
      para que los registros que la referencian sigan siendo válidos), pero un
      proveedor dado de baja deja de existir para toda consulta: responde `404`
      y nunca se devuelve con `active: false`. No hay reactivación.
    example: true
  createdAt:
    type: string
    format: date-time
    description: Fecha y hora del alta.
    readOnly: true
    example: '2026-08-22T15:30:00.000Z'
  updatedAt:
    type: string
    format: date-time
    description: Fecha y hora de la última modificación.
    readOnly: true
    example: '2026-08-22T15:30:00.000Z'
