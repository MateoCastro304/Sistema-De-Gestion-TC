type: object
description: Raw material or supplies vendor.
required:
  - id
  - legalName
  - cuit
  - contactName
  - active
  - createdAt
  - updatedAt
properties:
  id:
    type: integer
    format: int64
    description: Unique identifier of the supplier, autogenerated.
    readOnly: true
    example: 1
  legalName:
    type: string
    minLength: 1
    maxLength: 120
    description: Legal name of the supplier as registered with the tax authority.
    example: Aceros del Sur S.A.
  cuit:
    type: string
    pattern: "^[0-9]{2}-[0-9]{8}-[0-9]{1}$"
    description: Argentine CUIT. Format XX-XXXXXXXX-X. Immutable.
    example: "30-70987654-3"
  contactName:
    type: string
    maxLength: 120
    description: Name of the contact person at the supplier.
    example: Diego Fernandez
  contactEmail:
    type: string
    format: email
    maxLength: 120
    example: sales@acerosdelsur.com
  contactPhone:
    type: string
    maxLength: 40
    example: "+54 9 351 444-5678"
  address:
    type: string
    maxLength: 200
    example: Av. Circunvalacion 4500, Cordoba
  active:
    type: boolean
    description: |
      Whether the supplier is active. Deletion is logical: the record is never
      removed, this flag is set to false instead, so historical records that
      reference the supplier stay valid.
    default: true
    example: true
  createdAt:
    type: string
    format: date-time
    readOnly: true
    example: "2026-08-22T15:30:00Z"
  updatedAt:
    type: string
    format: date-time
    readOnly: true
    example: "2026-08-22T15:30:00Z"
