type: object
description: Raw material or supplies vendor.
required:
  - id
  - legalName
  - supplierType
  - active
  - createdAt
  - updatedAt
properties:
  id:
    type: integer
    format: int64
    description: Unique identifier of the supplier, autogenerated.
    readOnly: true
    example: 1
  legalName:
    type: string
    minLength: 1
    maxLength: 80
    description: |
      Legal name of the supplier as registered with the tax authority.

      Unique among the active suppliers, ignoring case: "Aceros del Sur" and
      "ACEROS DEL SUR" are the same legal name. A supplier that was dado de
      baja releases its legal name.
    example: Aceros del Sur S.A.
  cuit:
    type: string
    pattern: "^[0-9]{2}-[0-9]{8}-[0-9]{1}$"
    description: |
      Argentine CUIT. Format XX-XXXXXXXX-X. Optional.

      Validated beyond the pattern: the prefix must be one of the assignable
      ones and the check digit must be correct, so a well-formed but invalid
      CUIT is rejected with a 400.

      Unique among the active suppliers. A supplier that was dado de baja
      releases its CUIT.
    example: "30-71234567-1"
  supplierType:
    type: string
    description: |
      Category of goods or services the supplier provides. A supplier has
      exactly one, defined on creation and immutable afterwards.
      PROCESS — machining, welding, assembly.
      REPLACEMENT — spare parts, consumables.
      MATERIAL — raw materials, semi-finished products.
      PAINT — paints, coatings, varnishes.
    enum:
      - PROCESS
      - REPLACEMENT
      - MATERIAL
      - PAINT
    example: MATERIAL
  contactName:
    type: string
    maxLength: 150
    description: Name of the contact person at the supplier.
    example: Diego Fernandez
  contactEmail:
    type: string
    format: email
    maxLength: 120
    example: sales@acerosdelsur.com
  contactPhone:
    type: string
    maxLength: 50
    description: |
      Validated as a phone number: 8 to 15 digits, optionally prefixed with
      the international "+". Presentation separators (spaces, dashes, dots,
      parentheses) are accepted on input and dropped on storage, so the value
      returned here is normalised.
    example: "+5493514445678"
  address:
    type: string
    maxLength: 255
    example: Av. Circunvalacion 4500, Cordoba
  observation:
    type: string
    maxLength: 255
    description: Free-text note about the supplier.
    example: Entrega los martes
  active:
    type: boolean
    description: |
      Whether the supplier is active. Deletion is logical: the record is never
      removed, this flag is set to false instead, so historical records that
      reference the supplier stay valid.

      Always true in a response. A supplier dado de baja stops existing for
      every query — it is answered with 404 and never serialised with
      active:false — and there is no reactivation.
    default: true
    example: true
  createdAt:
    type: string
    format: date-time
    readOnly: true
    example: "2026-08-22T15:30:00Z"
  updatedAt:
    type: string
    format: date-time
    readOnly: true
    example: "2026-08-22T15:30:00Z"
