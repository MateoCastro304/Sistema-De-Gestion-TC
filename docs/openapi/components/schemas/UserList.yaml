type: object
description: |
  Página de usuarios, ordenada por nombre de usuario. Incluye los bloqueados
  siempre y los inactivos solo con `includeInactive` (D-28). Sin resultados,
  `items` vacío y `total` en `0`.
required:
  - items
  - total
  - page
  - limit
properties:
  items:
    type: array
    items:
      $ref: './User.yaml'
  total:
    type: integer
    format: int64
    minimum: 0
    description: Total de usuarios que cumplen los filtros.
    example: 8
  page:
    type: integer
    minimum: 1
    description: Página devuelta.
    example: 1
  limit:
    type: integer
    minimum: 1
    maximum: 1000
    description: Tamaño de página aplicado.
    example: 20
