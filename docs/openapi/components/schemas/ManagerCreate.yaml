type: object
description: |
  Payload required to create a new manager. The factory the manager
  belongs to is taken from the path (/factories/{factoryId}/managers) —
  it does not go in the body.
required:
  - name
properties:
  name:
    type: string
    minLength: 1
    maxLength: 120
    example: Marcela Rios
  email:
    type: string
    format: email
    maxLength: 120
    example: purchasing@oxycam.com
  phone:
    type: string
    maxLength: 40
    example: '+54 9 351 555-1234'
  role:
    type: string
    maxLength: 80
    description: Position or role of the manager within the factory.
    example: Head of Purchasing
