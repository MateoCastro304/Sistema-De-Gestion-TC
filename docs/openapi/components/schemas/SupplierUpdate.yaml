type: object
description: |
  Campos modificables de un proveedor. Todos opcionales, pero tiene que llegar
  al menos uno; se modifican solo los que llegan.

  `legalName` y `cuit` se pueden cambiar mientras pasen sus validaciones.
  `supplierType` se define en el alta y no se puede modificar.

  Los campos opcionales (`cuit`, `contactName`, `contactEmail`,
  `contactPhone`, `address`, `observation`) se borran con `null`.

  `active` no se acepta: no hay reactivación, porque un proveedor dado de baja
  libera su CUIT y su razón social y traerlo de vuelta podría duplicar a quien
  los tomó. Cualquier campo desconocido, `active` y `supplierType` incluidos,
  responde `400`.
additionalProperties: false
minProperties: 1
properties:
  legalName:
    $ref: './Supplier.yaml#/properties/legalName'
  cuit:
    type: string
    pattern: '^[0-9]{2}-[0-9]{8}-[0-9]{1}$'
    nullable: true
    description: CUIT con formato XX-XXXXXXXX-X. `null` lo borra.
    example: 30-71234567-1
  contactName:
    type: string
    maxLength: 150
    nullable: true
    description: Persona de contacto. `null` la borra.
    example: Diego Fernández
  contactEmail:
    type: string
    format: email
    maxLength: 120
    nullable: true
    description: Mail de contacto. `null` lo borra.
    example: ventas@acerosdelsur.com
  contactPhone:
    type: string
    maxLength: 50
    nullable: true
    description: Teléfono de contacto. `null` lo borra.
    example: +54 9 351 444-5678
  address:
    type: string
    maxLength: 255
    nullable: true
    description: Dirección. `null` la borra.
    example: Av. Circunvalación 4500, Córdoba
  observation:
    type: string
    maxLength: 255
    nullable: true
    description: Nota libre. `null` la borra.
    example: Entrega los martes
