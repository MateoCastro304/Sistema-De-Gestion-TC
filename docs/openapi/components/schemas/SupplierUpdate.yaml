type: object
description: |
  Modifiable fields of a supplier. All optional — the client sends only the
  fields that should change. At least one property must be present.

  The legalName and cuit can be changed as long as they pass their own
  validations. The supplierTypes are defined on creation and cannot be
  modified, so they are not accepted here.

  The optional fields (cuit, contactName, contactEmail, contactPhone,
  address) can be cleared by sending null.
minProperties: 1
properties:
  legalName:
    $ref: "./Supplier.yaml#/properties/legalName"
  cuit:
    type: string
    pattern: "^[0-9]{2}-[0-9]{8}-[0-9]{1}$"
    nullable: true
    description: Argentine CUIT. Format XX-XXXXXXXX-X. Send null to clear it.
    example: "30-70987654-3"
  contactName:
    type: string
    maxLength: 120
    nullable: true
    description: |
      Name of the contact person at the supplier. Send null to clear it.
    example: Diego Fernandez
  contactEmail:
    type: string
    format: email
    maxLength: 120
    nullable: true
    description: Send null to clear it.
    example: sales@acerosdelsur.com
  contactPhone:
    type: string
    maxLength: 40
    nullable: true
    description: Send null to clear it.
    example: "+54 9 351 444-5678"
  address:
    type: string
    maxLength: 200
    nullable: true
    description: Send null to clear it.
    example: Av. Circunvalacion 4500, Cordoba
  active:
    $ref: "./Supplier.yaml#/properties/active"
