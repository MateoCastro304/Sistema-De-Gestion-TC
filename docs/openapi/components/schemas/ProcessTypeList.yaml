type: object
description: |
  Página de tipos de proceso, ordenada por nombre. Sin resultados, `items`
  vacío y `total` en `0`.
required:
  - items
  - total
  - page
  - limit
properties:
  items:
    type: array
    items:
      $ref: './ProcessType.yaml'
  total:
    type: integer
    format: int64
    minimum: 0
    description: Total de tipos de proceso que cumplen los filtros.
    example: 7
  page:
    type: integer
    minimum: 1
    description: Página devuelta.
    example: 1
  limit:
    type: integer
    minimum: 1
    maximum: 100
    description: Tamaño de página aplicado.
    example: 20
