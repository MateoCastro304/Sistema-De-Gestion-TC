type: object
description: |
  Alta de fábrica. Queda activa y sin encargados; se agregan después con
  `POST /factories/{factoryId}/managers`. Un campo opcional vacío (`""`) se
  guarda como `null`.
additionalProperties: false
required:
  - legalName
  - cuit
  - categoryId
properties:
  legalName:
    type: string
    minLength: 1
    maxLength: 100
    description: Razón social. No vacía. Única entre las fábricas activas, sin distinguir mayúsculas.
    example: OxyCAM S.A.
  cuit:
    type: string
    minLength: 1
    maxLength: 50
    description: |
      CUIT. Acepta separadores (`33-70912345-4`), que se descartan al guardar.
      Tiene que tener 11 dígitos, un prefijo asignable y el dígito verificador
      correcto. Único entre las fábricas activas.
    example: 33-70912345-4
  address:
    type: string
    nullable: true
    maxLength: 255
    description: Dirección.
    example: Ruta 9 Km 12, Córdoba
  payMethod:
    type: string
    nullable: true
    maxLength: 255
    description: Aclaraciones sobre el pago (texto libre).
    example: Transferencia a 30 días
  categoryId:
    type: integer
    format: int64
    minimum: 1
    description: Rubro de la fábrica. Tiene que existir y estar activo; si no, responde `400`.
    example: 1
