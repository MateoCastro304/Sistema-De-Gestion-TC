type: object
description: |
  Contact person within a factory. A factory may have one or many
  managers. Lives as a sub-resource under /factories/{factoryId}/managers.
required:
  - id
  - name
  - createdAt
  - updatedAt
properties:
  id:
    type: integer
    format: int64
    readOnly: true
    example: 1
  name:
    type: string
    minLength: 1
    maxLength: 120
    example: Marcela Rios
  email:
    type: string
    format: email
    maxLength: 120
    example: purchasing@oxycam.com
  phone:
    type: string
    maxLength: 40
    example: '+54 9 351 555-1234'
  role:
    type: string
    maxLength: 80
    description: Position or role of the manager within the factory.
    example: Head of Purchasing
  createdAt:
    type: string
    format: date-time
    readOnly: true
    example: '2026-08-22T15:30:00Z'
  updatedAt:
    type: string
    format: date-time
    readOnly: true
    example: '2026-08-22T15:30:00Z'
