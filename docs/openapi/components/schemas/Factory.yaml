type: object
description: |
  Fábrica cliente: la persona jurídica a la que se factura. Sus personas de
  contacto son los encargados (`/factories/{factoryId}/customers`).

  La baja es lógica (`PATCH /factories/{id}/deactivate`): una fábrica dada de
  baja se sigue devolviendo con `isActive` en `false`.

  A diferencia del resto de la API, `id` y `categoryId` se serializan como
  string, y los campos opcionales vacíos como `""` en vez de `null`.
required:
  - id
  - name
  - cuit
  - address
  - payMethod
  - categoryId
  - isActive
properties:
  id:
    type: string
    pattern: '^[0-9]+$'
    description: Identificador único (entero serializado como string).
    readOnly: true
    example: '1'
  name:
    type: string
    maxLength: 100
    description: Razón social. Única entre las fábricas activas, sin distinguir mayúsculas.
    example: OxyCAM S.A.
  cuit:
    type: string
    pattern: '^[0-9]{11}$'
    description: |
      CUIT, 11 dígitos sin separadores. Único entre las fábricas activas.
      Inmutable: no se puede modificar.
    example: '33709123454'
  address:
    type: string
    maxLength: 255
    description: Dirección; `""` si no tiene.
    example: Ruta 9 Km 12, Córdoba
  payMethod:
    type: string
    maxLength: 255
    description: Aclaraciones sobre el pago (texto libre); `""` si no tiene.
    example: Transferencia a 30 días
  categoryId:
    type: string
    pattern: '^[0-9]+$'
    description: Rubro de la fábrica (`/categories/{id}`), serializado como string.
    example: '1'
  isActive:
    type: boolean
    description: '`false` si fue dada de baja.'
    example: true
