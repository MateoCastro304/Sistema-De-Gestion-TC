description: |
  The operation cannot be completed due to a conflict with the current
  state of the resource (for example, deleting a category with associated
  factories).
content:
  application/json:
    schema:
      $ref: '../schemas/Error.yaml'
    example:
      statusCode: 409
      error: Conflict
      message: Cannot delete category because it has associated factories.
      path: /api/categories/1
      timestamp: '2026-08-22T15:30:00Z'
