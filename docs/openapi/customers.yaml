openapi: 3.0.3
info:
  title: Torneria Castro API — Customers (Clientes)
  description: |
    Contrato PROPUESTO por el frontend (DTC-53) para el catalogo de clientes.
    Pendiente de confirmacion/ajuste por el backend (DTC-54).

    La ERS modela "Cliente" como EncargadoCliente + FabricaCliente:
      - Customer (EncargadoCliente, CU-01..04): nombre, apellido, telefono, mail
        y la fabrica a la que pertenece. La baja es logica (isActive=false).
      - Factory (FabricaCliente, CU-58..61): nombre, CUIT, direccion, descripcion
        de pago (texto libre) y rubro. Una fabrica tiene varios encargados.
      - Industry (Rubro, CU-41..44): catalogo referenciado por la fabrica; se
        puede crear inline desde el alta de fabrica. Incluye "Particular".
  version: 0.2.0
paths:
  # Un encargado se identifica por la clave compuesta (factoryId, id): en la BD
  # (manager_customer) la PK es (factory_id, id) y el id reinicia en 1 por cada
  # fabrica, asi que solo es unico junto al factoryId. Por eso las operaciones
  # sobre un encargado van anidadas bajo su fabrica; /customers queda solo como
  # el listado global.
  /customers:
    get:
      summary: List customers (CU-03)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
  /factories/{factoryId}/customers:
    parameters:
      - $ref: '#/components/parameters/FactoryId'
    post:
      summary: Create customer (CU-01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '409':
          description: >-
            Mail duplicado dentro de la fabrica (escenario 2) o fabrica
            inexistente/inactiva.
  /factories/{factoryId}/customers/{id}:
    parameters:
      - $ref: '#/components/parameters/FactoryId'
      - $ref: '#/components/parameters/EntityId'
    get:
      summary: Get customer by (factoryId, id)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Not found
    patch:
      summary: Update customer (CU-02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Not found
        '409':
          description: Mail duplicado dentro de la fabrica (escenario 2)
  /factories/{factoryId}/customers/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/FactoryId'
      - $ref: '#/components/parameters/EntityId'
    patch:
      summary: Baja logica de un cliente (CU-04)
      responses:
        '200':
          description: Deactivated (isActive=false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Not found
  /factories:
    get:
      summary: List factories (CU-60)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Factory'
    post:
      summary: Create factory (CU-58)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactoryInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
        '409':
          description: CUIT o codigo de fabrica ya registrados (escenario 2)
  /factories/{id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    patch:
      summary: Update factory (CU-59)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactoryInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
        '404':
          description: Not found
        '409':
          description: CUIT o codigo de fabrica ya registrados (escenario 2)
  /industries:
    get:
      summary: List rubros (CU-43)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Industry'
    post:
      summary: Create rubro (CU-41)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndustryInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Industry'
components:
  parameters:
    EntityId:
      name: id
      in: path
      required: true
      schema:
        type: string
    FactoryId:
      name: factoryId
      in: path
      required: true
      description: Id de la fabrica dueña del encargado (parte de la PK compuesta).
      schema:
        type: string
  schemas:
    Industry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        isActive:
          type: boolean
      required: [id, isActive]
    IndustryInput:
      type: object
      properties:
        name:
          type: string
      required: []
    Factory:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
          minLength: 3
          maxLength: 4
          description: >-
            Codigo unico de fabrica (3-4 caracteres, en mayusculas). Prefijo del
            id interno secuencial de piezas sin plano (ERS §2.3).
        cuit:
          type: string
          description: CUIT en 11 digitos (sin guiones).
        address:
          type: string
        payMethod:
          type: string
          description: Texto libre con aclaraciones sobre el pago de la fabrica.
        industryId:
          type: string
        isActive:
          type: boolean
      required:
        - id
        - name
        - code
        - cuit
        - payMethod
        - isActive
    FactoryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 3
          maxLength: 4
          description: Codigo unico de fabrica (3-4 caracteres alfanumericos).
        cuit:
          type: string
        address:
          type: string
        payMethod:
          type: string
          minLength: 1
        industryId:
          type: string
      required:
        - name
        - code
        - cuit
        - payMethod
    Customer:
      type: object
      description: EncargadoCliente, la persona de contacto de una fabrica.
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          description: >-
            Telefono / WhatsApp. Condicional: al menos uno entre phone y mail
            (col nullable manager_customer.phone).
        hasWhatsapp:
          type: boolean
          description: Si el telefono admite WhatsApp (canal de envio del informe, CU-21).
        mail:
          type: string
          format: email
          description: >-
            Condicional: al menos uno entre mail y phone. Unico dentro de la
            fabrica (col nullable manager_customer.mail).
        observation:
          type: string
          description: Notas internas (texto libre).
        factoryId:
          type: string
        isActive:
          type: boolean
      required:
        - id
        - firstName
        - lastName
        - hasWhatsapp
        - observation
        - factoryId
        - isActive
    CustomerInput:
      type: object
      description: >-
        Alta/edicion de encargado. Regla: al menos uno entre mail y phone; el
        mail, si se envia, debe ser unico dentro de la fabrica y con formato
        valido.
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        phone:
          type: string
        hasWhatsapp:
          type: boolean
        mail:
          type: string
          format: email
        observation:
          type: string
        factoryId:
          type: string
      required:
        - firstName
        - lastName
        - hasWhatsapp
        - observation
        - factoryId
