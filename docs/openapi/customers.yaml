openapi: 3.0.3
info:
  title: Torneria Castro API — Customers (Clientes)
  description: |
    Contrato PROPUESTO por el frontend (DTC-53) para el catalogo de clientes.
    Pendiente de confirmacion/ajuste por el backend (DTC-54).

    La ERS modela "Cliente" como EncargadoCliente + FabricaCliente:
      - Customer (EncargadoCliente, CU-01..04): nombre, apellido, telefono, mail
        y la fabrica a la que pertenece. La baja es logica (isActive=false).
      - Factory (FabricaCliente, CU-58..61): nombre, CUIT, direccion, descripcion
        de pago (texto libre) y rubro. Una fabrica tiene varios encargados.
      - Industry (Rubro, CU-41..44): catalogo referenciado por la fabrica; se
        puede crear inline desde el alta de fabrica. Incluye "Particular".
  version: 0.2.0
paths:
  /customers:
    get:
      summary: List customers (CU-03)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
    post:
      summary: Create customer (CU-01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '409':
          description: Conflicto (p. ej. cliente ya registrado)
  /customers/{id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    get:
      summary: Get customer by id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Not found
    patch:
      summary: Update customer (CU-02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Not found
  /customers/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    patch:
      summary: Baja logica de un cliente (CU-04)
      responses:
        '200':
          description: Deactivated (isActive=false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Not found
  /factories:
    get:
      summary: List factories (CU-60)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Factory'
    post:
      summary: Create factory (CU-58)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactoryInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
  /factories/{id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    patch:
      summary: Update factory (CU-59)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactoryInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
        '404':
          description: Not found
  /industries:
    get:
      summary: List rubros (CU-43)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Industry'
    post:
      summary: Create rubro (CU-41)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndustryInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Industry'
components:
  parameters:
    EntityId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    Industry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        isActive:
          type: boolean
      required: [id, name, isActive]
    IndustryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
      required: [name]
    Factory:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        cuit:
          type: string
          description: CUIT en 11 digitos (sin guiones).
        address:
          type: string
        paymentDescription:
          type: string
          description: Texto libre con aclaraciones sobre el pago de la fabrica.
        industryId:
          type: string
        isActive:
          type: boolean
      required:
        - id
        - name
        - cuit
        - address
        - paymentDescription
        - industryId
        - isActive
    FactoryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        cuit:
          type: string
        address:
          type: string
          minLength: 1
        paymentDescription:
          type: string
          minLength: 1
        industryId:
          type: string
      required:
        - name
        - cuit
        - address
        - paymentDescription
        - industryId
    Customer:
      type: object
      description: EncargadoCliente, la persona de contacto de una fabrica.
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        factoryId:
          type: string
        isActive:
          type: boolean
      required:
        - id
        - firstName
        - lastName
        - phone
        - email
        - factoryId
        - isActive
    CustomerInput:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        factoryId:
          type: string
      required:
        - firstName
        - lastName
        - phone
        - email
        - factoryId
