services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: torneria-backend
    restart: unless-stopped
    networks:
      - torneria-network
    env_file:
      - ../../backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../build:/build:ro

  frontend-dev:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    container_name: torneria-frontend
    restart: unless-stopped
    networks:
      - torneria-network

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: torneria-postgres
    restart: unless-stopped
    networks:
      - torneria-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    container_name: torneria-nginx
    networks:
      - torneria-network

networks:
  torneria-network:
    driver: bridge
