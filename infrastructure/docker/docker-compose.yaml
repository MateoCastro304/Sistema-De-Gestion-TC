name: torneria

x-database-url: &database-url
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

services:
    backend:
        build:
            context: ../../backend
            dockerfile: Dockerfile
        container_name: torneria-backend
        environment:
            <<: *database-url
        restart: "unless-stopped"
        networks:
            - torneria-network
        depends_on:
            postgres:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        volumes:
            - ../../build:/build:ro

    postgres:
        build:
            context: ./postgres
            dockerfile: Dockerfile
        container_name: torneria-postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        restart: "unless-stopped"
        networks:
            - torneria-network
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    web:
        container_name: torneria-web
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        networks:
            - torneria-network

    migrate:
        build:
            context: ../../backend
            dockerfile: Dockerfile
            target: production
        container_name: torneria-migrate
        environment:
            <<: *database-url
        restart: "no"
        networks:
            - torneria-network
        depends_on:
            postgres:
                condition: service_healthy
        command: npx prisma migrate deploy

networks:
    torneria-network:
        driver: bridge
