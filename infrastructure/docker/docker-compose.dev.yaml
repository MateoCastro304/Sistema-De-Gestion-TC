services:
  backend:
    build:
      target: development
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - '3000:3000'
    depends_on:
      openapi-build:
        condition: service_completed_successfully
    volumes:
      - ../../backend:/app
      - /app/node_modules
    command: npm run start:dev

  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  frontend-dev:
    build:
      target: development
    ports:
      - '5173:5173'
    volumes:
      - ../../frontend:/app
      - /app/node_modules

  web:
    image: nginx:alpine
    depends_on: [backend, frontend-dev]
    ports:
      - '80:80'
    volumes:
      - ./nginx/web-nginx.conf:/etc/nginx/conf.d/default.conf:ro

  openapi-build:
    build:
      context: ../../tooling/openapi
      dockerfile: Dockerfile
    container_name: torneria_openapi_build
    networks:
      - torneria-network
    volumes:
      - ../../docs/openapi:/docs/openapi:ro
      - ../../build:/build

  openapi-docs:
    image: nginx:alpine
    container_name: torneria_openapi_docs
    ports:
      - '8081:80'
    networks:
      - torneria-network
    depends_on:
      openapi-build:
        condition: service_completed_successfully
    volumes:
      - ../../build:/usr/share/nginx/html:ro

volumes:
  postgres_dev_data:
