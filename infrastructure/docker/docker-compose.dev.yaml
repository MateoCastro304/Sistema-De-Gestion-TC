services:
  backend:
    container_name: torneria-backend-dev
    build:
      target: development
    ports:
      - '3000:3000'
    env_file:
      - ./.env.dev
    depends_on:
      openapi-build:
        condition: service_completed_successfully
    volumes:
      - ../../backend:/app
      - /app/node_modules
    command: npm run start:dev

  postgres:
    container_name: torneria-postgres-dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  frontend:
    container_name: torneria-frontend-dev
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      target: development
    restart: 'unless-stopped'
    ports:
      - '5173:5173'
    networks:
      - torneria-network
    volumes:
      - ../../frontend:/app
      - /app/node_modules

  web:
    container_name: torneria-web-server-dev
    image: nginx:alpine
    depends_on: [backend, frontend]
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro

  openapi-build:
    build:
      context: ../../tooling/openapi
      dockerfile: Dockerfile
    container_name: torneria-openapi-build
    restart: 'no'
    networks:
      - torneria-network
    volumes:
      - ../../docs/openapi:/docs/openapi:ro
      - ../../build:/build

  openapi-docs:
    image: nginx:alpine
    container_name: torneria-openapi-docs
    ports:
      - '8081:80'
    networks:
      - torneria-network
    depends_on:
      openapi-build:
        condition: service_completed_successfully
    volumes:
      - ../../build:/usr/share/nginx/html:ro

volumes:
  postgres_dev_data:
