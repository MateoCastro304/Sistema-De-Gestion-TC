services:
  backend:
    build:
      target: development
    ports:
      - '3000:3000'
    env_file:
      - ./.env.dev
    depends_on:
      openapi-build:
        condition: service_completed_successfully
    volumes:
      - ../../backend:/app
      - /app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    command: npm run start:dev
    environment:
      - TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal

  postgres:
    container_name: torneria-postgres-dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  frontend:
    container_name: torneria-frontend-dev
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      target: development
    restart: 'unless-stopped'
    ports:
      - '5173:5173'
    networks:
      - torneria-network
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    environment:
      # Dentro del contenedor "localhost" no es el backend: el proxy
      # de Vite tiene que apuntar al servicio por su nombre.
      - API_PROXY_TARGET=http://backend:3000
      # Sin polling, en Windows y Mac los cambios de codigo no se ven
      # hasta reiniciar el contenedor.
      - VITE_WATCH_POLLING=true
      # En Docker el backend siempre esta: nunca responder con mocks,
      # aunque el .env.local de quien levanta los tenga prendidos.
      - VITE_USE_MOCKS=false

  web:
    container_name: torneria-web-server-dev
    image: nginx:alpine
    depends_on: [backend, frontend]
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro

  openapi-build:
    build:
      context: ../../tooling/openapi
      dockerfile: Dockerfile
    container_name: torneria-openapi-build
    restart: 'no'
    networks:
      - torneria-network
    volumes:
      - ../../docs/openapi:/docs/openapi:ro
      - ../../build:/build

  openapi-docs:
    image: swaggerapi/swagger-ui
    container_name: torneria-openapi-docs
    ports:
      - '8081:8080'
    networks:
      - torneria-network
    depends_on:
      openapi-build:
        condition: service_completed_successfully
    environment:
      - SWAGGER_JSON=/spec/openapi.yaml
      # "Try it out" sends cookies, so the session endpoints can be tested:
      # the browser keeps the refresh_token cookie set by POST /auth/login.
      - WITH_CREDENTIALS=true
    volumes:
      - ../../build:/spec:ro

  adminer:
    image: adminer:latest
    container_name: torneria-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    networks:
      - torneria-network
    depends_on:
      postgres:
        condition: service_healthy

  seaweed:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: torneria-seaweed-dev
    restart: unless-stopped
    # start.sh arma el JSON de credenciales y despues llama al entrypoint
    # de la imagen, que corrige los permisos de /data y baja a usuario seaweed.
    entrypoint: ['sh', '/etc/config/start.sh']
    ports:
      - '127.0.0.1:8333:8333'
    networks:
      - torneria-network
    # Credenciales de backup y admin. Van aparte de .env.dev porque el
    # backend carga ese archivo entero.
    env_file:
      - ./.env.storage.dev
    environment:
      - S3_BUCKET=${S3_BUCKET}
      - S3_BUCKET_UPLOADS=${S3_BUCKET_UPLOADS}
      - S3_BUCKET_BACKUPS=${S3_BUCKET_BACKUPS}
      - S3_BACKEND_ACCESS_KEY=${S3_BACKEND_ACCESS_KEY}
      - S3_BACKEND_SECRET_KEY=${S3_BACKEND_SECRET_KEY}
      - S3_CORS_ORIGINS=${S3_CORS_ORIGINS}
    volumes:
      - ./seaweed:/etc/config:ro
      - seaweed_dev_data:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot, como migrate: configura los buckets con la credencial de admin
  # y termina. Usa la misma API que S3 real.
  storage-init:
    image: amazon/aws-cli:2.22.0@sha256:de60944022e023e69cc50e3cfc91766d0788c27586b01fb77806bc435b484a35
    container_name: torneria-storage-init
    restart: 'no'
    entrypoint: ['sh', '/etc/config/init.sh']
    networks:
      - torneria-network
    depends_on:
      seaweed:
        condition: service_healthy
    env_file:
      - ./.env.storage.dev
    environment:
      - S3_BUCKET_UPLOADS=${S3_BUCKET_UPLOADS}
      - AWS_ENDPOINT_URL=http://seaweed:8333
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./seaweed:/etc/config:ro

volumes:
  postgres_dev_data:
  seaweed_dev_data:
