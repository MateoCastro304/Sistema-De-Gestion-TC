services:
  backend:
    build:
      target: development
    ports:
      - "3000:3000"
    env_file:
      - ./.env.dev
    depends_on:
      openapi-build:
        condition: service_completed_successfully
    volumes:
      - ../../backend:/app
      - /app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    command: npm run start:dev
    environment:
      - TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal

  postgres:
    container_name: torneria-postgres-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  frontend:
    container_name: torneria-frontend-dev
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      target: development
    restart: "unless-stopped"
    ports:
      - "5173:5173"
    networks:
      - torneria-network
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    environment:
      # Dentro del contenedor "localhost" no es el backend: el proxy
      # de Vite tiene que apuntar al servicio por su nombre.
      - API_PROXY_TARGET=http://backend:3000
      # Sin polling, en Windows y Mac los cambios de codigo no se ven
      # hasta reiniciar el contenedor.
      - VITE_WATCH_POLLING=true
      # En Docker el backend siempre esta: nunca responder con mocks,
      # aunque el .env.local de quien levanta los tenga prendidos.
      - VITE_USE_MOCKS=false

  web:
    container_name: torneria-web-server-dev
    image: nginx:alpine
    depends_on: [backend, frontend]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro

  openapi-build:
    build:
      context: ../../tooling/openapi
      dockerfile: Dockerfile
    container_name: torneria-openapi-build
    restart: "no"
    networks:
      - torneria-network
    volumes:
      - ../../docs/openapi:/docs/openapi:ro
      - ../../build:/build

  openapi-docs:
    image: swaggerapi/swagger-ui
    container_name: torneria-openapi-docs
    ports:
      - "8081:8080"
    networks:
      - torneria-network
    depends_on:
      openapi-build:
        condition: service_completed_successfully
    environment:
      - SWAGGER_JSON=/spec/openapi.yaml
      # "Try it out" sends cookies, so the session endpoints can be tested:
      # the browser keeps the refresh_token cookie set by POST /auth/login.
      - WITH_CREDENTIALS=true
    volumes:
      - ../../build:/spec:ro

  adminer:
    image: adminer:latest
    container_name: torneria-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - torneria-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev_data:
