apis:
  main:
    root: ../../docs/openapi/openapi.yaml
extends:
  # recommended-strict = the recommended rules, with warnings turned into errors.
  # Same principle as ESLint (--max-warnings 0): a warning nobody reads is
  # useless, so a rule is either an error or off.
  - recommended-strict
rules:
  info-license-strict: off
  # The declared servers are local on purpose (Nginx at localhost/api and the
  # backend at localhost:3000): Swagger UI (localhost:8081) uses them for "Try
  # it out" in development. The production host does not exist yet (see the
  # TODO under servers). Once it does, add it as another server; this rule can
  # go back to 'error' if localhost is removed from the contract.
  #
  # Single problems ignored on purpose live in .redocly.lint-ignore.yaml, each
  # with its reason.
  no-server-example.com: off
